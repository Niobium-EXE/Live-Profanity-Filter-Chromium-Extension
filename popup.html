<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Profanity Filter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header>
      <div>
        <h1>Live Profanity Filter</h1>
        <p id="statusText">Loading…</p>
      </div>
      <label class="switch" title="Turn filtering on or off everywhere">
        <input id="enabledToggle" type="checkbox">
        <span class="slider"></span>
      </label>
    </header>

    <section class="card">
      <h2>Quick add</h2>
      <label>
        Word or phrase
        <input id="wordInput" type="text" autocomplete="off" placeholder="word or phrase">
      </label>
      <label>
        Replace with
        <input id="replacementInput" type="text" autocomplete="off" placeholder="censored">
      </label>
      <button id="addButton" class="primary">Add now</button>
      <p id="message" class="message" aria-live="polite"></p>
    </section>

    <section class="card">
      <div class="card-heading">
        <h2>Edit filter</h2>
        <span id="filterCount" class="count"></span>
      </div>
      <label>
        Filter
        <select id="editRuleSelect"></select>
      </label>
      <div id="editFields" class="edit-fields">
        <label>
          Word or phrase
          <input id="editWord" type="text" autocomplete="off">
        </label>
        <label>
          Replace with
          <input id="editReplacement" type="text" autocomplete="off" placeholder="uses default if blank">
        </label>
        <label>
          Match
          <select id="editMatch">
            <option value="exact">Exact</option>
            <option value="partial">Partial</option>
            <option value="whole">Whole containing word</option>
            <option value="regex">Regular expression</option>
          </select>
        </label>
        <div class="check-grid">
          <label class="check"><input id="editEnabled" type="checkbox"> Enabled</label>
          <label class="check"><input id="editRepeated" type="checkbox"> Repeated letters</label>
          <label class="check"><input id="editSeparators" type="checkbox"> Separators</label>
        </div>
        <div class="edit-actions">
          <button id="saveEdit" class="primary">Save changes</button>
          <button id="deleteEdit" class="danger">Delete</button>
        </div>
      </div>
    </section>

    <section class="card compact">
      <label>
        Default replacement
        <input id="defaultReplacement" type="text" autocomplete="off">
      </label>
      <p class="hint">Replacements are bracketed by default, for example: <strong>[censored]</strong>.</p>
    </section>

    <footer>
      <button id="siteToggle" class="secondary">Disable on this site</button>
      <button id="openOptions" class="secondary">Full settings</button>
    </footer>
  </main>
  <script src="core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
